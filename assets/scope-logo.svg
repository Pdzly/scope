<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="28" height="28">
  <title>Scope for Linux</title>
  <!--
    Title-bar chip: the Scope mark (source of truth: docs/scope-mark.svg) on a white disc.
    GPUI's `img()` rasterises an SVG at 2x its intrinsic size and then scales it
    into the element box, so the declared 28px keeps the render at the title-bar size.
  -->
  <circle cx="128" cy="128" r="128" fill="#ffffff"/>
  <g transform="translate(128 128) scale(0.74) translate(-128 -124)">
    <g fill="#e10600">
      <g transform="translate(128 104) rotate(-22) translate(-118 0)">
        <rect x="6" y="-6" width="28" height="12" rx="3"/>
        <rect x="38" y="-11" width="18" height="22" rx="3"/>
        <path d="M60 -15 C120 -17 150 -19 184 -21 L184 21 C150 19 120 17 60 15 Z"/>
        <rect x="188" y="-25" width="40" height="50" rx="6"/>
        <rect x="94" y="-33" width="44" height="9" rx="4.5"/>
        <rect x="103" y="-26" width="4" height="10"/>
        <rect x="125" y="-27" width="4" height="11"/>
        <path d="M219 -15 Q223 0 219 15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="128" cy="113" r="9"/>
      <path d="M121 116 h14 l3 20 h-20 z"/>
    </g>
    <g stroke="#e10600" stroke-linecap="round" fill="none">
      <line x1="123" y1="136" x2="86" y2="222" stroke-width="7"/>
      <line x1="133" y1="136" x2="170" y2="222" stroke-width="7"/>
      <line x1="128" y1="136" x2="128" y2="206" stroke-width="5"/>
      <line x1="107" y1="176" x2="149" y2="176" stroke-width="4"/>
    </g>
  </g>
</svg>
